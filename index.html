<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupo F Pure Flow - Editor de Galaxias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="Style.css">

</head>
<body class="d-flex flex-column h-100">

  <nav class="navbar editor-navbar navbar-dark px-3 py-2 d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center">
      <span class="fs-5 fw-bold text-light me-2">GRUPO F</span>
      <span class="fs-5 fw-bold text-glow-blue me-4">| PURE FLOW</span>
      <div class="d-none d-md-block">
        <h6 class="mb-0 text-white fs-6">Editor de Galaxias</h6>
        <small class="text-muted d-block" style="font-size: 0.75rem;">Proyecto espacial sin título</small>
      </div>
    </div>

    <div class="d-flex align-items-center gap-2">
      <div class="btn-group btn-group-sm" role="group">
        <button type="button" class="btn btn-outline-primary active">2D</button>
        <button type="button" class="btn btn-outline-primary">3D</button>
      </div>
    </div>

    <div class="d-flex align-items-center text-muted gap-3">
      <small style="font-size: 0.8rem;"><i class="bi bi-cloud-check-fill text-success me-1"></i>Guardado hace 2 min</small>
    </div>
  </nav>

  <div class="container-fluid flex-grow-1 p-0">
    <div class="row g-0">
      
      <div class="col-lg-2 sidebar p-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="text-uppercase fw-bold text-white m-0">Paleta de Órbitas</h6>
          <span class="badge bg-primary rounded-pill">14</span>
        </div>

        <div class="accordion" id="paletaAccordion">
          
          <div class="accordion-item mb-2">
            <h2 class="accordion-header">
              <button class="accordion-button py-2 px-3 fs-6" type="button" data-bs-toggle="collapse" data-bs-target="#espacio">
                Espacio / Entorno
              </button>
            </h2>
            <div id="espacio" class="accordion-collapse collapse show">
              <div class="accordion-body p-2">
                <div class="row g-2">
                  <div class="col-6">
                    <div class="palette-item">
                      <i class="bi bi-brightness-high text-warning"></i> Estrella
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="palette-item">
                      <i class="bi bi-alt text-glow-purple"></i> Nebulosa
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="palette-item">
                      <i class="bi bi-border-style text-secondary"></i> Vacío
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="accordion-item mb-2">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed py-2 px-3 fs-6" type="button" data-bs-toggle="collapse" data-bs-target="#cuerpos">
                Cuerpos Celestes
              </button>
            </h2>
            <div id="cuerpos" class="accordion-collapse collapse">
              <div class="accordion-body p-2">
                <div class="row g-2">
                  <div class="col-6">
                    <div class="palette-item">
                      <i class="bi bi-globe text-primary"></i> Planeta
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="palette-item">
                      <i class="bi bi-circle-fill text-info"></i> Asteroide
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="palette-item">
                      <i class="bi bi-stars text-warning"></i> Cometa
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="palette-item">
                      <i class="bi bi-moon-fill text-muted"></i> Luna
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="accordion-item mb-2">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed py-2 px-3 fs-6" type="button" data-bs-toggle="collapse" data-bs-target="#equipos">
                Equipos
              </button>
            </h2>
            <div id="equipos" class="accordion-collapse collapse">
              <div class="accordion-body p-2">
                <div class="row g-2">
                  <div class="col-6">
                    <div class="palette-item">
                      <i class="bi bi-broadcast text-info"></i> Satélite
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="palette-item">
                      <i class="bi bi-rocket-takeoff-fill text-danger"></i> Sonda
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="palette-item">
                      <i class="bi bi-shield-shaded text-success"></i> Nave
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="palette-item">
                      <i class="bi bi-trash text-muted"></i> Basura
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="accordion-item mb-2">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed py-2 px-3" type="button" data-bs-toggle="collapse" data-bs-target="#instalaciones">
                Instalaciones
              </button>
            </h2>
            <div id="instalaciones" class="accordion-collapse collapse">
              <div class="accordion-body p-2">
                <div class="row g-2">
                  <div class="col-6">
                    <div class="palette-item">
                      <i class="bi bi-building-fill text-primary"></i> Base
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="palette-item">
                      <i class="bi bi-house-door-fill text-success"></i> Hangar
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="palette-item">
                      <i class="bi bi-egg-fill text-info"></i> Cúpula
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <div class="col-lg-7 space-canvas-wrapper d-flex flex-column">
        <div class="canvas-toolbar d-flex justify-content-between align-items-center p-2">
          <div class="d-flex align-items-center gap-4">
            <span class="text-glow-blue font-monospace" style="font-size: 0.85rem;">X 7 | Y 12</span>
          </div>
          <div class="d-flex gap-2">
            <div class="input-group input-group-sm" style="width: 140px;">
              <button class="btn btn-outline-secondary" type="button">-</button>
              <input type="text" class="form-control text-center" value="100%" readonly>
              <button class="btn btn-outline-secondary" type="button">+</button>
            </div>
            <button class="btn btn-sm btn-outline-light d-flex align-items-center gap-1">
              <i class="bi bi-image"></i> Cambiar imagen
            </button>
          </div>
        </div>

        <div class="space-grid flex-grow-1 position-relative overflow-hidden">
          
          <div class="cosmic-object text-center" style="top: 25%; left: 30%;">
            <i class="bi bi-stars text-warning opacity-50" style="font-size: 35px;"></i>
          </div>
          <div class="cosmic-object text-center" style="top: 20%; left: 80%;">
            <i class="bi bi-asterisk text-muted" style="font-size: 15px;"></i>
          </div>
          <div class="cosmic-object text-center" style="top: 15%; left: 10%;">
            <i class="bi bi-star-fill text-white opacity-25" style="font-size: 10px;"></i>
          </div>
          <div class="cosmic-object text-center" style="top: 60%; left: 8%;">
            <i class="bi bi-star-fill text-white opacity-40" style="font-size: 8px;"></i>
          </div>
          
          <div class="cosmic-object text-center" style="top: 75%; left: 20%;">
            <i class="bi bi-collection text-secondary" style="font-size: 30px; transform: rotate(15deg);"></i>
          </div>
          <div class="cosmic-object text-center" style="top: 80%; left: 75%;">
            <i class="bi bi-collection text-secondary opacity-70" style="font-size: 25px;"></i>
          </div>
          <div class="cosmic-object text-center" style="top: 55%; left: 80%;">
            <i class="bi bi-collection text-secondary" style="font-size: 40px; transform: rotate(-45deg);"></i>
          </div>

          <div class="cosmic-object" style="top: 50%; left: 50%;">
            <div class="position-relative d-flex justify-content-center align-items-center" style="width: 140px; height: 140px;">
              <div class="position-absolute border border-primary border-dashed rounded-circle opacity-20" style="width: 100%; height: 100%;"></div>
              <div class="position-absolute border border-info border-dashed rounded-circle opacity-30" style="width: 80%; height: 80%;"></div>
              
              <div class="bg-dark rounded-3 border border-info p-2 d-flex gap-2 flex-wrap justify-content-center align-items-center" style="z-index: 2; width: 60px; height: 60px; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);">
                <i class="bi bi-building-fill text-info" style="font-size: 24px;"></i>
              </div>
              
              <div class="cosmic-object text-center" style="top: -10%; left: 50%;">
                <i class="bi bi-broadcast text-info" style="font-size: 15px;"></i>
              </div>
              <div class="cosmic-object text-center" style="top: 110%; left: 50%;">
                <i class="bi bi-broadcast text-info" style="font-size: 15px;"></i>
              </div>
              <div class="cosmic-object text-center" style="top: 50%; left: -10%;">
                <i class="bi bi-broadcast text-info" style="font-size: 15px;"></i>
              </div>
              <div class="cosmic-object text-center" style="top: 50%; left: 110%;">
                <i class="bi bi-broadcast text-info" style="font-size: 15px;"></i>
              </div>
            </div>
          </div>

        </div>
      </div>

      <div class="col-lg-3 sidebar-right p-3">
        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="text-uppercase fw-bold text-white m-0">Inspector</h6>
            <span class="badge bg-secondary">Capa 1</span>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label text-white-50 small mb-1 fw-semibold">Capas</label>
          <div class="list-group">
            <div class="list-group-item layer-item d-flex justify-content-between align-items-center py-1 px-2 mb-1 rounded">
              <span><i class="bi bi-eye-fill me-2 text-info"></i> Eventos</span>
            </div>
            <div class="list-group-item layer-item d-flex justify-content-between align-items-center py-1 px-2 mb-1 rounded">
              <span><i class="bi bi-eye-fill me-2 text-info"></i> Órbita 3</span>
            </div>
            <div class="list-group-item layer-item d-flex justify-content-between align-items-center py-1 px-2 mb-1 rounded">
              <span><i class="bi bi-eye-fill me-2 text-info"></i> Órbita 2</span>
            </div>
            <div class="list-group-item layer-item active d-flex justify-content-between align-items-center py-1 px-2 mb-1 rounded">
              <span><i class="bi bi-eye-fill me-2 text-primary"></i> Órbita 1</span>
            </div>
          </div>
        </div>

        <div>
          <h6 class="text-uppercase fw-bold text-white small mb-3 border-bottom border-dark pb-1">Propiedades</h6>
          
          <div class="mb-3">
            <label class="form-label text-muted small mb-1">Nombre</label>
            <input type="text" class="form-control form-control-sm" value="Hangar Alpha">
          </div>

          <div class="mb-3">
            <label class="form-label text-muted small mb-1">Tile</label>
            <select class="form-select form-select-sm">
              <option selected>Estructuras → Base</option>
              <option>Entorno → Estelar</option>
              <option>Cuerpo → Asteroide</option>
            </select>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label text-muted small mb-1">Posición X</label>
              <input type="number" class="form-control form-control-sm" value="7">
            </div>
            <div class="col-6">
              <label class="form-label text-muted small mb-1">Posición Y</label>
              <input type="number" class="form-control form-control-sm" value="12">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted small mb-1">Capa</label>
            <input type="text" class="form-control form-control-sm" value="Óbita 1" disabled>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
